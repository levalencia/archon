#cloud-config
# Cogentrex VM bootstrap. Application deployment is performed later by the
# GitHub Actions OIDC workflow through Azure VM Run Command.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - python3

write_files:
  - path: /usr/local/sbin/cogentrex-bootstrap.sh
    owner: root:root
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      . /etc/os-release
      printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu %s stable\n' \
        "$(dpkg --print-architecture)" "$VERSION_CODENAME" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash

      systemctl enable --now docker
      usermod -aG docker cogentrex

      install -d -o cogentrex -g cogentrex -m 0750 /opt/cogentrex
      install -d -o cogentrex -g cogentrex -m 0700 \
        /opt/cogentrex/.state /opt/cogentrex/backups /opt/cogentrex/media \
        /var/tmp/cogentrex

      cat > /etc/profile.d/cogentrex.sh <<'PROFILE'
      export TMPDIR=/var/tmp/cogentrex
      export XDG_STATE_HOME=/opt/cogentrex/.state
      export COGENTREX_APP_ROOT=/opt/cogentrex
      PROFILE
      chmod 0644 /etc/profile.d/cogentrex.sh

runcmd:
  - /usr/local/sbin/cogentrex-bootstrap.sh

final_message: "Cogentrex VM cloud-init completed in $UPTIME seconds"
