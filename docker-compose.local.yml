name: cogentrex-local

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    ports:
      - "127.0.0.1:${COGENTREX_LOCAL_PORT:-8080}:8080"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  backend:
    platform: ${COGENTREX_LOCAL_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COGENTREX_DATABASE_URL: postgresql+asyncpg://cogentrex:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/cogentrex
      COGENTREX_REDIS_URL: redis://redis:6379/0
      COGENTREX_SECRET_KEY: ${COGENTREX_SECRET_KEY:?COGENTREX_SECRET_KEY is required}
      COGENTREX_ENCRYPTION_MASTER_KEY: ${COGENTREX_ENCRYPTION_MASTER_KEY:?COGENTREX_ENCRYPTION_MASTER_KEY is required}
      COGENTREX_MEMORY_ENCRYPTION_ENABLED: "true"
      COGENTREX_LLM_PROVIDER: ${COGENTREX_LLM_PROVIDER:-mock}
      COGENTREX_LLM_MODEL: ${COGENTREX_LLM_MODEL:-mock-model}
      COGENTREX_LLM_API_KEY: ${COGENTREX_LLM_API_KEY:-}
      COGENTREX_LLM_BASE_URL: ${COGENTREX_LLM_BASE_URL:-}
      COGENTREX_PROMPT_CACHING_ENABLED: ${COGENTREX_PROMPT_CACHING_ENABLED:-true}
      COGENTREX_DURABLE_MONETARY_BUDGET_ENABLED: "true"
      COGENTREX_DURABLE_EFFECT_LEDGER_ENABLED: "true"
      COGENTREX_EFFECT_IDENTITY_SECRET: ${COGENTREX_EFFECT_IDENTITY_SECRET:?COGENTREX_EFFECT_IDENTITY_SECRET is required}
      COGENTREX_AGENT_DEADLINE_SECONDS: ${COGENTREX_AGENT_DEADLINE_SECONDS:-300}
      COGENTREX_VERIFIER_ENABLED: ${COGENTREX_VERIFIER_ENABLED:-false}
      COGENTREX_VERIFIER_MODEL: ${COGENTREX_VERIFIER_MODEL:-verifier-model}
      COGENTREX_VERIFIER_RETRIES: ${COGENTREX_VERIFIER_RETRIES:-1}
      COGENTREX_DELEGATION_SIGNING_KEY: ${COGENTREX_DELEGATION_SIGNING_KEY:?COGENTREX_DELEGATION_SIGNING_KEY is required}
      COGENTREX_HYBRID_ORCHESTRATION_ENABLED: ${COGENTREX_HYBRID_ORCHESTRATION_ENABLED:-false}
      COGENTREX_EMBEDDING_PROVIDER: ${COGENTREX_EMBEDDING_PROVIDER:-mock}
      COGENTREX_EMBEDDING_MODEL: ${COGENTREX_EMBEDDING_MODEL:-mock-embedding}
      COGENTREX_EMBEDDING_API_KEY: ${COGENTREX_EMBEDDING_API_KEY:-}
      COGENTREX_EMBEDDING_BASE_URL: ${COGENTREX_EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      COGENTREX_EMBEDDING_ALLOWED_HOSTS: ${COGENTREX_EMBEDDING_ALLOWED_HOSTS:-api.openai.com}
      COGENTREX_EMBEDDING_DIMENSIONS: ${COGENTREX_EMBEDDING_DIMENSIONS:-256}
      COGENTREX_EMBEDDING_API_VERSION: ${COGENTREX_EMBEDDING_API_VERSION:-2024-05-01-preview}
      COGENTREX_EMBEDDING_CACHE_PATH: ${COGENTREX_EMBEDDING_CACHE_PATH:-/opt/embedding-models}
      COGENTREX_BRAVE_API_KEY: ${COGENTREX_BRAVE_API_KEY:-}
      COGENTREX_LEARNING_TUTOR_WEB_SUPPLEMENT_ENABLED: ${COGENTREX_LEARNING_TUTOR_WEB_SUPPLEMENT_ENABLED:-false}
      COGENTREX_LEARNING_TUTOR_WEB_MAX_RESULTS: ${COGENTREX_LEARNING_TUTOR_WEB_MAX_RESULTS:-3}
      COGENTREX_EXECUTION_ENABLED: "true"
      COGENTREX_EXECUTION_RUNNER_SOCKET: /run/cogentrex-sandbox/runner.sock
      COGENTREX_RATE_LIMIT_BACKEND: redis
      COGENTREX_OTEL_ENDPOINT: http://otel-collector:4317
      COGENTREX_OTEL_SERVICE_NAME: cogentrex-local
      COGENTREX_OTEL_CAPTURE_MESSAGE_CONTENT: ${COGENTREX_OTEL_CAPTURE_MESSAGE_CONTENT:-false}
      COGENTREX_LEARNING_MEDIA_ENABLED: ${COGENTREX_LEARNING_MEDIA_ENABLED:-false}
      COGENTREX_LEARNING_MEDIA_LIBRARY_ROOT: /var/lib/cogentrex-learning
      OTEL_BSP_SCHEDULE_DELAY: "200"
      COGENTREX_DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
      sandbox-runner:
        condition: service_healthy
    volumes:
      - sandbox-socket:/run/cogentrex-sandbox
      - ${COGENTREX_LEARNING_MEDIA_HOST_DIR:-../cogentrex-learning-media}:/var/lib/cogentrex-learning:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  sandbox-runner:
    # Keep the security runner native so nested child seccomp is not attempted under QEMU.
    platform: ${COGENTREX_SANDBOX_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: sandbox_runner/Dockerfile
    environment:
      SANDBOX_SOCKET_PATH: /run/cogentrex-sandbox/runner.sock
    init: true
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      # Preserve Moby's outer deny-by-default profile while permitting nested child seccomp.
      # Backend startup fails closed unless that child-level probe succeeds.
      - no-new-privileges:true
      - seccomp=./sandbox_runner/seccomp-bootstrap.json
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=10001,gid=10001
      - /work:rw,nosuid,nodev,size=16m,uid=10001,gid=10001
    volumes:
      - sandbox-socket:/run/cogentrex-sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.socket(socket.AF_UNIX);s.connect('/run/cogentrex-sandbox/runner.sock');s.sendall(b'{\"version\":1,\"operation\":\"health\"}\\n');assert b'\"status\":\"ok\"' in s.recv(256)"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: http://localhost:${COGENTREX_LOCAL_PORT:-8080}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: cogentrex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: cogentrex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cogentrex -d cogentrex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0@sha256:3f6274fe609da4f9964fbc2ef36b83d08d47964fbb11629251393590d3924072
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - ${COGENTREX_OTEL_COLLECTOR_CONFIG_FILE:-./deploy/otel-collector.local.yml}:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  jaeger:
    profiles: ["jaeger"]
    image: jaegertracing/all-in-one:1.64.0@sha256:7e9591218e7ddd51e568ef892e3ea190ae420ecf97c4d718910a3f57e076c216
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${COGENTREX_JAEGER_PORT:-16686}:16686"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  redis-data:
  sandbox-socket: