apiVersion: apps/v1
kind: Deployment
metadata:
  name: cogentrex-backend
  labels:
    app: cogentrex
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cogentrex
      component: backend
  template:
    metadata:
      labels:
        app: cogentrex
        component: backend
    spec:
      containers:
        - name: backend
          image: cogentrex-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: COGENTREX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cogentrex-secrets
                  key: database-url
            - name: COGENTREX_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: cogentrex-secrets
                  key: redis-url
            - name: COGENTREX_LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: cogentrex-config
                  key: llm-provider
            - name: COGENTREX_LLM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: cogentrex-config
                  key: llm-model
            - name: COGENTREX_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cogentrex-secrets
                  key: jwt-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cogentrex-backend
spec:
  selector:
    app: cogentrex
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cogentrex-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: cogentrex.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cogentrex-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cogentrex-frontend
                port:
                  number: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cogentrex-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cogentrex-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cogentrex-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cogentrex
      component: backend
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cogentrex-config
data:
  llm-provider: "ollama"
  llm-model: "llama3.1:8b"
---
apiVersion: v1
kind: Secret
metadata:
  name: cogentrex-secrets
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://cogentrex:cogentrex@postgres:5432/cogentrex"
  redis-url: "redis://redis:6379/0"
  jwt-secret: "change-me-in-production"
