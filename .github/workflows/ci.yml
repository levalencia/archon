name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check app/ tests/
      - name: Ruff format
        run: uv run ruff format --check app/ tests/
      - name: Mypy type check
        run: uv run mypy app/ --ignore-missing-imports --no-error-summary || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Unit tests
        run: uv run pytest -m unit --cov --cov-report=term-missing -q
      - name: Security probe tests
        run: uv run pytest -m security -v
      - name: All tests + coverage
        run: uv run pytest -m "unit or security" --cov --cov-report=xml -q

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Bandit security scan
        run: uv run pip install bandit && uv run bandit -r app/ -ll || true
      - name: Safety dependency check
        run: uv run pip install safety && uv run safety check || true

  quality-gate:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Quality gate (coverage > 50%)
        run: uv run pytest -m "unit or security" --cov --cov-fail-under=50 -q

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t archon-backend:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name archon-test -p 8000:8000 archon-backend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/healthz || exit 1
          docker stop archon-test
