name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Ruff format
        run: uv run ruff format --check app tests
      - name: Backend tests
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Svelte and TypeScript checks
        run: npm run check
      - name: Frontend tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test

  backend-image:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t archon-backend:${{ github.sha }} .
      - name: Smoke test backend image
        run: |
          docker run -d --name archon-test -p 8000:8000 archon-backend:${{ github.sha }}
          trap 'docker rm -f archon-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs archon-test
          exit 1
