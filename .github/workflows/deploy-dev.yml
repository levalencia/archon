name: Deploy Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # ── Quality gates (mirror CI) ──────────────────────────────────────
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check app tests ../scripts/validate-course-docs.py
      - name: Ruff format
        run: uv run ruff format --check app tests ../scripts/validate-course-docs.py
      - name: Course documentation contracts
        run: uv run python ../scripts/validate-course-docs.py
      - name: Bandit security scan
        run: uv run bandit -r app -ll
      - name: Backend tests
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=50

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Svelte and TypeScript checks
        run: npm run check
      - name: Frontend tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test

  backend-image:
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cogentrex-backend:${{ github.sha }} .
      - name: Smoke test backend image
        run: |
          memory_env_name='COGENTREX_ENCRYPTION_MASTER_'"KEY"
          memory_material="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export "${memory_env_name}=${memory_material}"
          docker run -d --name cogentrex-test -p 8000:8000 \
            -e COGENTREX_DATABASE_URL="sqlite+aiosqlite:////tmp/cogentrex-ci.db" \
            -e COGENTREX_MEMORY_ENCRYPTION_ENABLED=true \
            -e "$memory_env_name" \
            cogentrex-backend:${{ github.sha }}
          unset "$memory_env_name" memory_material
          trap 'docker rm -f cogentrex-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs cogentrex-test
          exit 1

  # ── Deploy to Azure dev VM ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-image]
    environment: development
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable application images
        env:
          ACR_NAME: ${{ vars.AZURE_DEV_ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ vars.AZURE_DEV_ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build -t "$ACR_LOGIN_SERVER/cogentrex-backend:$IMAGE_TAG" .
          docker build -f frontend/Dockerfile -t "$ACR_LOGIN_SERVER/cogentrex-frontend:$IMAGE_TAG" .
          docker build -f sandbox_runner/Dockerfile -t "$ACR_LOGIN_SERVER/cogentrex-sandbox:$IMAGE_TAG" .
          docker push "$ACR_LOGIN_SERVER/cogentrex-backend:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/cogentrex-frontend:$IMAGE_TAG"
          docker push "$ACR_LOGIN_SERVER/cogentrex-sandbox:$IMAGE_TAG"

      - name: Deploy via VM run-command
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RG: ${{ vars.AZURE_DEV_RESOURCE_GROUP }}
          DEPLOY_VM: ${{ vars.AZURE_DEV_VM_NAME }}
          DEPLOY_HOSTNAME: ${{ vars.AZURE_DEV_PUBLIC_HOSTNAME }}
          DEPLOY_KEY_VAULT: ${{ vars.AZURE_DEV_KEY_VAULT_NAME }}
          DEPLOY_ACR_NAME: ${{ vars.AZURE_DEV_ACR_NAME }}
          DEPLOY_ACR_LOGIN_SERVER: ${{ vars.AZURE_DEV_ACR_LOGIN_SERVER }}
          DEPLOY_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          az vm run-command invoke \
            --resource-group "$DEPLOY_RG" \
            --name "$DEPLOY_VM" \
            --command-id RunShellScript \
            --scripts '(
              set -eu
              install -d -m 0750 /opt/cogentrex
              if [ ! -d /opt/cogentrex/repo/.git ]; then
                git clone https://github.com/levalencia/cogentrex.git /opt/cogentrex/repo
              fi
              git -C /opt/cogentrex/repo fetch origin --prune
              git -C /opt/cogentrex/repo show "$1:scripts/azure/deploy-vm.sh" > /tmp/cogentrex-deploy-vm.sh
              chmod 0700 /tmp/cogentrex-deploy-vm.sh
              COGENTREX_PUBLIC_HOSTNAME="$2" COGENTREX_KEY_VAULT_NAME="$3" \
                COGENTREX_ACR_NAME="$4" COGENTREX_ACR_LOGIN_SERVER="$5" \
                COGENTREX_AZURE_SUBSCRIPTION_ID="$6" \
                /bin/bash /tmp/cogentrex-deploy-vm.sh "$1"
              )
              remote_status=$?
              printf "COGENTREX_RUN_COMMAND_EXIT=%s\n" "$remote_status"
              exit 0' \
            --parameters "$DEPLOY_SHA" "$DEPLOY_HOSTNAME" "$DEPLOY_KEY_VAULT" \
              "$DEPLOY_ACR_NAME" "$DEPLOY_ACR_LOGIN_SERVER" "$DEPLOY_SUBSCRIPTION_ID" \
            --output json > "$response_file"
          python3 - "$response_file" <<'PY'
          import json
          import re
          import sys

          response = json.load(open(sys.argv[1], encoding="utf-8"))
          message = "\n".join(item.get("message", "") for item in response.get("value", []))
          print(message)
          match = re.search(r"COGENTREX_RUN_COMMAND_EXIT=(\d+)", message)
          if match is None or match.group(1) != "0":
              raise SystemExit("Azure VM deployment script failed")
          PY

      - name: Smoke test dev endpoint
        env:
          SMOKE_URL: ${{ vars.AZURE_DEV_SMOKE_URL }}
        run: |
          health_ok=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "${SMOKE_URL}/healthz" > health.json; then
              health_ok=true
              break
            fi
            echo "Attempt ${attempt}/30 – waiting 10s..."
            sleep 10
          done
          test "$health_ok" = true || { echo "Health probe did not succeed" >&2; exit 1; }
          python - <<'PY'
          import json
          health = json.load(open("health.json", encoding="utf-8"))
          assert health["status"] == "alive"
          assert health["llm_provider"] == "openai"
          assert health["llm_model"] == "DeepSeek-V4-Flash"
          PY
          curl --fail --silent --max-time 10 "${SMOKE_URL}/readyz" > ready.json
          python - <<'PY'
          import json
          ready = json.load(open("ready.json", encoding="utf-8"))
          assert ready["status"] == "ready"
          PY
          curl --fail --silent --max-time 10 "${SMOKE_URL}/learn" >/dev/null
          echo "Dev smoke passed for ${SMOKE_URL}"

      - name: Capture deployment evidence
        if: always()
        run: |
          mkdir -p evidence
          echo "commit: ${{ github.sha }}"            > evidence/deploy-dev.txt
          echo "ref: ${{ github.ref }}"               >> evidence/deploy-dev.txt
          echo "actor: ${{ github.actor }}"           >> evidence/deploy-dev.txt
          echo "run_id: ${{ github.run_id }}"         >> evidence/deploy-dev.txt
          echo "run_number: ${{ github.run_number }}" >> evidence/deploy-dev.txt
          echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> evidence/deploy-dev.txt

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dev-evidence-${{ github.run_number }}
          path: evidence/
          retention-days: 30
