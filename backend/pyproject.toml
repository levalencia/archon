[project]
name = "archon"
version = "0.1.0"
description = "Archon: Production AI Agent Webapp"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "sse-starlette>=2.1.0",
    "aiosqlite>=0.22.1",
    "tiktoken>=0.14.0",
    "pyjwt>=2.13.0",
    "anthropic>=1.0.0",
    "spacy>=3.8.15",
    "python-dotenv>=1.2.3",
    "idna>=3.10",
    "mcp==2.1.1",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7.10",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx",
    "fakeredis>=2.23.0",
]
llm = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (needs Docker services)",
    "security: Security probe tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 50

