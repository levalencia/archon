version: 1
entries:
- id: adapter-pattern
  term: Adapter
  aliases:
  - concrete adapter
  - hexagonal adapter
  category: python-architecture
  level: intermediate
  definition: A concrete class that implements a port (Protocol) by translating between the core application's typed
    boundary and an external system's specific API or format.
  cogentrex: OpenAI, Anthropic, Foundry, and Ollama typed adapters implement the ModelProvider Protocol. SecureToolRegistry
    implements ToolExecutor. Each adapter translates between Cogentrex typed values and vendor-specific APIs.
  concept_ids:
  - python-protocols-di
  - provider-adapters-capability-parity
  related_ids: []
  learn_more:
  - docs/course/concepts/provider-adapters-capability-parity.md
  - docs/course/concepts/oop-protocols-dependency-injection.md
  - backend/app/runtime/ports.py
  media_refs:
  - label: Video 4 — ports and adapters
    href: /learn?view=present&pack=code-first-series&artifact=code-first-video-04&t=84.2
  eval_concept_ids: []
- id: additional-properties
  term: Additional properties
  aliases:
  - extra properties
  category: tools-policy-security
  level: beginner
  definition: Fields present in a JSON object but not declared by its schema. Strict contracts reject them so misspellings
    and model-invented arguments cannot slip through.
  cogentrex: SecureToolRegistry rejects undeclared tool arguments instead of silently ignoring them.
  concept_ids:
  - json-schema-subset
  - tool-contracts
  related_ids: []
  learn_more:
  - docs/course/concepts/json-schema.md
  - backend/app/tools/registry.py
  media_refs: []
  eval_concept_ids: []
- id: aes-gcm
  term: AES-GCM
  aliases:
  - authenticated encryption
  - AES-256-GCM
  category: context-memory
  level: advanced
  definition: An authenticated encryption mode that provides both confidentiality and integrity. Each encryption
    uses a fresh random nonce, and additional authenticated data binds the ciphertext to its intended context.
  cogentrex: Used by ScopedEncryptedMemoryRepository with a fresh 12-byte nonce from os.urandom per encryption.
    AAD binds domain label, owner, project, fact ID, and key version.
  concept_ids:
  - encrypted-memory
  related_ids: []
  learn_more:
  - docs/course/concepts/encrypted-memory.md
  media_refs: []
  eval_concept_ids: []
- id: agent
  term: Agent
  aliases:
  - AI agent
  - software agent
  category: foundations
  level: beginner
  definition: Software that repeatedly asks a language model what to do, may call tools, observes results, and stops
    under rules owned by the surrounding program. An agent is more than one model response.
  cogentrex: Cogentrex is a custom typed runtime, not an agent framework. The AgentRuntime class owns the loop,
    budgets, policy checks, and event emission while the model acts only as an untrusted planner.
  concept_ids:
  - agent-anatomy
  related_ids: []
  learn_more:
  - docs/course/concepts/agent-anatomy.md
  - docs/course/modules/00-agent-anatomy/README.md
  - backend/app/runtime/engine.py
  media_refs: []
  eval_concept_ids: []
- id: agent-communication-security
  term: Agent communication security
  aliases:
  - HMAC envelope
  - delegation security
  - envelope security
  category: tools-policy-security
  level: advanced
  definition: Cryptographic authentication of delegation metadata between parent and child agents. The envelope
    binds claim/evidence content, scope, budget, freshness, nonce, schema, and key version.
  cogentrex: backend/app/delegation/envelope.py issues parent-signed HMAC envelopes bound to actual bounded claim/evidence
    content, owner/project/run scope, budget, freshness, nonce, schema, and key version with durable replay receipts.
  concept_ids:
  - agent-communication-security
  related_ids: []
  learn_more:
  - docs/course/modules/11-bounded-delegation/README.md
  - docs/course/concepts/agent-communication-security.md
  media_refs: []
  eval_concept_ids: []
- id: agent-event
  term: Agent event
  aliases:
  - AgentEvent
  - runtime event
  - Discriminated event
  category: runtime
  level: intermediate
  definition: An immutable event record emitted by the runtime at a significant transition. It carries an event
    kind, iteration number, safe data payload, and token usage for observable execution.
  cogentrex: AgentEvent is defined in runtime/events.py. The EventSink Protocol receives these events for SSE streaming,
    run-ledger persistence, structured logging, and observability export.
  concept_ids:
  - typed-runtime
  - runtime-state-machine
  related_ids: []
  learn_more:
  - backend/app/runtime/events.py
  - docs/course/reference/event-catalog.md
  media_refs: []
  eval_concept_ids: []
- id: agent-event-kind
  term: Agent event kind
  aliases:
  - AgentEventKind
  - event kind
  category: runtime
  level: intermediate
  definition: 'A string enum classifying each runtime event: RUN_STARTED, ITERATION_STARTED, MODEL_RESPONSE, TOOL_CALL_REQUESTED,
    POLICY_DECIDED, TOOL_CALL_COMPLETED, APPROVAL_REQUIRED, RUN_STOPPED, and many others. The closed set makes event
    handling exhaustive.'
  cogentrex: AgentEventKind is a closed StrEnum in events.py covering model, tool, policy, approval, delegation,
    reflection, grounding, and lifecycle transitions.
  concept_ids:
  - typed-runtime
  - runtime-state-machine
  related_ids: []
  learn_more:
  - backend/app/runtime/events.py
  - docs/course/reference/event-catalog.md
  media_refs: []
  eval_concept_ids: []
- id: agent-result
  term: Agent result
  aliases:
  - AgentResult
  category: runtime
  level: intermediate
  definition: A frozen dataclass returned when a run finishes, containing the final content, stop reason, iteration
    count, recorded tool calls, accumulated token usage, optional error, and optional structured output.
  cogentrex: AgentResult is defined in engine.py. It is the single return value of AgentRuntime.run(), giving callers
    a complete typed summary of what happened without inspecting the event stream.
  concept_ids:
  - typed-runtime
  - runtime-state-machine
  related_ids: []
  learn_more:
  - backend/app/runtime/engine.py
  - docs/course/concepts/typed-runtime.md
  media_refs: []
  eval_concept_ids: []
- id: agent-runtime
  term: Agent runtime
  aliases:
  - runtime
  - AgentRuntime
  category: runtime
  level: beginner
  definition: The deterministic program that owns the agent loop, state transitions, budgets, policy checks, events,
    and stopping decisions. It is the authority; the model is only a planner.
  cogentrex: Implemented as the AgentRuntime class in engine.py. It injects Protocol-based ports (ModelProvider,
    ToolExecutor, PolicyEngine, EventSink) and executes an explicit bounded state-machine loop.
  concept_ids:
  - agent-anatomy
  - typed-runtime
  related_ids: []
  learn_more:
  - docs/course/concepts/typed-runtime.md
  - docs/course/modules/02-typed-runtime/README.md
  - backend/app/runtime/engine.py
  - docs/course/code-walkthroughs/runtime.md
  media_refs: []
  eval_concept_ids: []
- id: application-factory
  term: Application factory
  aliases:
  - create_app
  - app factory
  category: python-architecture
  level: beginner
  definition: A function that constructs and consistently configures the application object, registering middleware,
    routers, and startup hooks. Callers can inject controlled collaborators for testing.
  cogentrex: create_app() in main.py is the application factory. It creates the FastAPI instance, registers the
    lifespan handler that initializes repositories and application state, mounts middleware and routers.
  concept_ids:
  - application-composition
  related_ids: []
  learn_more:
  - docs/course/concepts/application-composition.md
  - backend/app/main.py
  - docs/course/modules/01-python-architecture/README.md
  media_refs:
  - label: Video 2 — application factory vocabulary
    href: /learn?view=present&pack=code-first-series&artifact=code-first-video-02&t=123.5
  eval_concept_ids:
  - factory
- id: application-lifecycle
  term: Application lifecycle
  aliases:
  - server lifecycle
  - startup lifecycle
  category: python-architecture
  level: beginner
  definition: An application lifecycle is the ordered set of stages from construction and startup through serving
    requests to controlled shutdown.
  cogentrex: Cogentrex constructs the FastAPI app, runs lifespan startup and preflight work, becomes ready, serves
    requests, then tears resources down.
  concept_ids:
  - application-composition
  eval_concept_ids:
  - application-lifecycle
  related_ids: []
  learn_more:
  - docs/course/concepts/application-composition.md
  media_refs:
  - label: Video 1 — lifecycle overview
    href: /learn?view=present&pack=code-first-series&artifact=code-first-video-01&t=0
- id: application-state
  term: Application state
  aliases:
  - app.state
  - process state
  category: python-architecture
  level: intermediate
  definition: Process-owned shared configuration and services stored on the FastAPI application object, not user
    or conversation memory. Initialized during lifespan and available to all request handlers.
  cogentrex: app.state holds the configured provider, DurableApprovalBroker, persistence redactor, log buffer, and
    telemetry exporter. Routes access these through request.app.state for request-scoped dependency construction.
  concept_ids:
  - application-composition
  related_ids: []
  learn_more:
  - docs/course/concepts/application-composition.md
  - backend/app/main.py
  media_refs: []
  eval_concept_ids: []
- id: approval
  term: Approval
  aliases:
  - tool approval
  - human approval
  - durable approval
  - authorization
  category: tools-policy-security
  level: beginner
  definition: A human or host decision bound to an exact tool-call identity and argument hash. It is not a blanket
    trust grant; it is a one-use ticket that permits only the effect whose identity was shown.
  cogentrex: Implemented as DurableApprovalBroker with ApprovalRepository in backend/app/security/live_approvals.py
    and approval_repository.py. Exact binding covers owner/run/call identity, canonical tool name, and argument
    SHA-256 digest.
  concept_ids:
  - durable-approvals
  related_ids: []
  learn_more:
  - docs/course/concepts/durable-approvals.md
  - backend/app/security/approvals.py
  - backend/app/security/live_approvals.py
  - docs/course/reference/glossary.md
  media_refs: []
  eval_concept_ids: []
- id: approval-hint
  term: Approval hint
  aliases:
  - legacy approval hint
  category: tools-policy-security
  level: advanced
  definition: A legacy annotation on a tool indicating whether it should require approval. In the current rule-based
    policy, unmatched tools with a legacy hint produce ASK; the hint is a fallback, not primary policy.
  cogentrex: Stored as part of trusted ToolDefinition metadata. When no policy rule matches, a legacy approval hint
    produces ASK. Superseded by explicit policy rules when present.
  concept_ids:
  - tool-contracts
  - policy-engine
  related_ids: []
  learn_more:
  - docs/course/concepts/policy-engine.md
  - docs/course/concepts/tool-contracts.md
  media_refs: []
  eval_concept_ids: []
- id: approval-record
  term: Approval record
  aliases:
  - ApprovalRecord
  - approval receipt
  - Receipt
  category: tools-policy-security
  level: intermediate
  definition: A persisted database row recording an approval decision with user_id, conversation_id, run_id, status,
    reason, and timestamps. It intentionally stores no raw-arguments field.
  cogentrex: ApprovalRecord in backend/app/security/approval_repository.py. Terminal states are APPROVED, DENIED,
    EXPIRED, or CANCELLED. Conditional SQL update ensures only one transition wins from PENDING.
  concept_ids:
  - durable-approvals
  related_ids: []
  learn_more:
  - docs/course/concepts/durable-approvals.md
  media_refs: []
  eval_concept_ids: []
- id: approval-ttl
  term: Approval TTL
  aliases:
  - approval time-to-live
  - approval expiry
  - TTL
  category: tools-policy-security
  level: intermediate
  definition: The time-to-live after which a pending approval automatically becomes expired. This bounds human decision
    latency so the runtime does not wait indefinitely.
  cogentrex: ApprovalRepository.reserve inserts the receipt with a positive TTL. expire_due transitions stale pending
    approvals. The stop reason approval_timeout fires if the deadline passes.
  concept_ids:
  - durable-approvals
  related_ids: []
  learn_more:
  - docs/course/concepts/durable-approvals.md
  - docs/course/reference/stop-reasons.md
  media_refs: []
  eval_concept_ids: []
- id: arguments-hash
  term: Arguments hash
  aliases:
  - canonical arguments hash
  category: runtime
  level: advanced
  definition: A deterministic hash of the canonicalized tool call arguments used to bind an approval to an exact
    invocation. If arguments change, the hash changes and the approval no longer matches.
  cogentrex: canonical_arguments_hash in security/policy.py produces a stable hash from canonical_arguments_snapshot.
    This ensures approvals are exact-bound and cannot be reused for different arguments.
  concept_ids:
  - durable-approvals
  - policy-engine
  related_ids: []
  learn_more:
  - backend/app/security/policy.py
  - docs/course/concepts/durable-approvals.md
  media_refs: []
  eval_concept_ids: []
- id: artifact
  term: Artifact
  aliases:
  - output artifact
  - stored artifact
  category: context-memory
  level: intermediate
  definition: A named output produced during a run, such as generated code or a document. Artifacts are persisted
    with redaction and subject to the same data boundary controls as other stored content.
  cogentrex: backend/app/services/artifacts.py manages artifact storage. Artifacts pass through PersistenceRedactor
    before storage and are subject to security resource tests.
  concept_ids:
  - multimodal-and-artifacts
  related_ids: []
  learn_more:
  - docs/course/concepts/multimodal-and-artifacts.md
  media_refs: []
  eval_concept_ids: []
- id: artifact-persistence
  term: Artifact Persistence
  aliases:
  - artifact storage
  category: delivery-media
  level: intermediate
  definition: Storing generated artifacts (code, documents, media) with owner scoping, security scanning, and authenticated
    access controls.
  cogentrex: Cogentrex persists artifacts with owner scoping and security controls; no durable attachment backend
    or public hosting is claimed.
  concept_ids:
  - multimodal-and-artifacts
  related_ids: []
  learn_more:
  - docs/course/concepts/multimodal-and-artifacts.md
  media_refs: []
  eval_concept_ids: []
- id: async-await
  term: Async/await
  aliases:
  - async
  - await
  - cooperative concurrency
  - asyncio
  category: python-architecture
  level: beginner
  definition: Python's cooperative concurrency model where async functions yield control at await points while waiting
    for I/O. It does not automatically make CPU work faster; it enables efficient waiting.
  cogentrex: All provider calls, tool executions, approval waits, and event emissions are async. The runtime uses
    asyncio for cooperative I/O concurrency, guarded by deadlines to prevent indefinite waits.
  concept_ids:
  - async-python
  related_ids: []
  learn_more:
  - docs/course/concepts/async-python.md
  - docs/course/modules/01-python-architecture/README.md
  - backend/app/runtime/engine.py
  media_refs: []
  eval_concept_ids: []
- id: at-least-once
  term: At-least-once delivery
  aliases:
  - At-least-once
  category: tools-policy-security
  level: intermediate
  definition: A delivery strategy that retries to reduce lost work but may deliver the same operation more than
    once. Receivers therefore need idempotency.
  cogentrex: Cogentrex treats retries and duplicate requests as possible and uses stable identities plus effect-ledger
    checks to contain them.
  concept_ids:
  - idempotency
  related_ids: []
  learn_more:
  - docs/course/concepts/idempotency.md
  - backend/app/runtime/effect_ledger.py
  media_refs: []
  eval_concept_ids: []
- id: atomic-uniqueness
  term: Atomic uniqueness
  aliases: []
  category: tools-policy-security
  level: intermediate
  definition: A database constraint or conditional write that lets concurrent attempts choose one winner without
    a check-then-write race.
  cogentrex: The effect ledger relies on database-enforced uniqueness rather than process-local memory.
  concept_ids:
  - idempotency
  related_ids: []
  learn_more:
  - docs/course/concepts/idempotency.md
  - backend/app/runtime/effect_ledger.py
  media_refs: []
  eval_concept_ids: []
- id: audio-overview
  term: Audio Overview
  aliases:
  - podcast
  - audio summary
  category: delivery-media
  level: beginner
  definition: A generated audio recording that narrates key concepts from a source pack, designed for passive learning
    during commute or exercise.
  cogentrex: Cogentrex source packs declare audio as a target artifact type; generation follows the documented runbook
    when that publishing workflow is explicitly executed and reviewed.
  concept_ids:
  - multimodal-and-artifacts
  related_ids: []
  learn_more:
  - docs/visual-learning/learning-artifacts.yaml
  media_refs: []
  eval_concept_ids: []
- id: audit-log
  term: Audit log
  aliases:
  - audit trail
  - security audit
  - Audit
  category: tools-policy-security
  level: intermediate
  definition: Security and operational evidence about attempted tool execution, policy decisions, and authorization
    events. Audit records are persisted evidence, not real-time alerts.
  cogentrex: SecureToolRegistry.execute audits tool_executed events. Policy decisions, approval outcomes, and compliance
    checks produce audit evidence. Recorded events are control-flow evidence, not tamper-proof WORM storage.
  concept_ids:
  - tool-contracts
  - run-ledger
  related_ids: []
  learn_more:
  - docs/course/concepts/tool-contracts.md
  - docs/course/concepts/run-ledger.md
  media_refs: []
  eval_concept_ids: []
- id: authentication
  term: Authentication
  aliases:
  - auth
  - identity verification
  category: tools-policy-security
  level: beginner
  definition: Verifying that a request comes from a claimed identity. Authentication determines who you are; authorization
    determines what you may do. They are separate concerns.
  cogentrex: Local scrypt/JWT/API-key authentication in backend/app/security/auth.py. No external IdP, automated
    signing-key rotation, or production certification. Tested in test_auth_persistence and test_agent_auth.
  concept_ids:
  - authentication
  related_ids: []
  learn_more:
  - docs/course/modules/13-auth-ui-observability/README.md
  media_refs: []
  eval_concept_ids: []
- id: authorization-ownership
  term: Authorization and ownership
  aliases:
  - owner scoping
  category: tools-policy-security
  level: intermediate
  definition: Verifying that an authenticated identity has permission to access or modify a specific resource. In
    Cogentrex, data is scoped to owners and projects.
  cogentrex: Owner/project-scoped authorization in backend/app/security/auth.py and backend/app/routes/stream.py.
    Tested paths do not eliminate the need to review every new query and side effect.
  concept_ids:
  - authorization-ownership
  related_ids: []
  learn_more:
  - docs/course/modules/13-auth-ui-observability/README.md
  media_refs: []
  eval_concept_ids: []
- id: authorization-request
  term: Authorization request
  aliases:
  - AuthorizationRequest
  - ASK request
  category: tools-policy-security
  level: intermediate
  definition: 'The data structure representing a tool call that requires human approval: native tool_call_id, canonical
    tool_name, arguments_hash, risk classes, and the matched policy rule.'
  cogentrex: AuthorizationRequest in backend/app/security/approvals.py. AuthorizationOutcome.binds compares call
    ID, name, and digest exactly. Mismatch causes fail-closed denial.
  concept_ids:
  - durable-approvals
  related_ids: []
  learn_more:
  - docs/course/concepts/durable-approvals.md
  media_refs: []
  eval_concept_ids: []
- id: autonomous-unapproved-optimization
  term: Autonomous Unapproved Production Optimization
  aliases:
  - autonomous optimization
  - self-optimization
  category: delivery-media
  level: advanced
  definition: An agent automatically changing its own production configuration without human approval; requires
    safety controls, rollback, and kill switches.
  cogentrex: Autonomous unapproved optimization is deliberately excluded from Cogentrex; drift reports and promotions
    do not mutate runtime configuration.
  concept_ids:
  - autonomous-unapproved-production-optimization
  related_ids: []
  learn_more:
  - docs/REMAINING-DEFERRED-GAPS.md
  media_refs: []
  eval_concept_ids: []
- id: background-job
  term: Background job
  aliases:
  - durable job
  - task queue job
  category: context-memory
  level: intermediate
  definition: An owner/project-scoped durable task with atomic claim, lease fencing, heartbeat, retry/dead-letter,
    and cancellation. Execution is at-least-once, not exactly-once.
  cogentrex: backend/app/services/task_queue.py and backend/app/workers/jobs.py implement SQL-based durable jobs.
    Non-idempotent external-effect job kinds are prohibited because in-process coroutines cannot be forcibly killed.
  concept_ids:
  - background-jobs-scheduling
  related_ids: []
  learn_more:
  - docs/course/modules/10-resilience/README.md
  media_refs: []
  eval_concept_ids: []
- id: background-jobs-scheduling
  term: Background Jobs and Scheduling
  aliases:
  - job queue
  - task queue
  - background jobs
  category: observability-operations
  level: intermediate
  definition: Durable asynchronous task execution with claims, leases, heartbeat, retry, dead-letter, and cancellation,
    running outside the request path.
  cogentrex: Cogentrex implements durable owner/project-scoped SQL jobs with atomic claims, monotonic lease fencing,
    heartbeat, retry/dead-letter, and cancellation; at-least-once, not exactly-once.
  concept_ids:
  - background-jobs-scheduling
  related_ids: []
  learn_more:
  - docs/course/concepts/background-jobs-scheduling.md
  - docs/course/modules/10-resilience/README.md
  media_refs: []
  eval_concept_ids: []
- id: backup-restore
  term: Backup and Restore
  aliases:
  - backup
  - restore
  - DR backup
  category: observability-operations
  level: intermediate
  definition: Creating checksummed copies of data and proving they can be restored to a known state, supporting
    disaster recovery objectives.
  cogentrex: Cogentrex local checksummed clean restore is verified; scheduling, off-site storage, PITR, and cloud
    failover are absent.
  concept_ids:
  - backup-restore
  related_ids: []
  learn_more:
  - docs/course/concepts/backup-restore.md
  - docs/course/modules/14-local-operations/README.md
  - docs/DR-RUNBOOK.md
  media_refs: []
  eval_concept_ids: []
- id: batch-policy-evaluation
  term: Batch policy evaluation
  aliases:
  - pre-validation
  - batch pre-validate
  category: runtime
  level: advanced
  definition: The runtime evaluates policy for all tool calls in a model response as a batch before executing any
    of them. This prevents partial execution followed by denial.
  cogentrex: AgentRuntime pre-validates the complete call batch against policy before executing any tool. If any
    call is denied, the entire batch fails and no tools execute in that iteration.
  concept_ids:
  - policy-engine
  - react-loop
  related_ids: []
  learn_more:
  - backend/app/runtime/engine.py
  - docs/course/concepts/policy-engine.md
  media_refs: []
  eval_concept_ids: []
- id: benchmark
  term: Benchmark
  aliases:
  - eval benchmark
  - quality benchmark
  category: evaluation
  level: intermediate
  definition: A standardized set of evaluation cases and metrics used to compare agent performance across revisions
    or configurations.
  cogentrex: Cogentrex local portfolio benchmark uses deterministic mock evidence; it proves control behavior, not
    model quality or cross-system comparability.
  concept_ids:
  - evaluation-harness
  - datasets
  related_ids: []
  learn_more:
  - docs/course/concepts/evaluation-harness.md
  media_refs: []
  eval_concept_ids: []
- id: boundary-validation
  term: Boundary validation
  aliases: []
  category: python-architecture
  level: intermediate
  definition: Checking and normalizing values when they cross from an untrusted or loosely typed source into a trusted
    domain.
  cogentrex: Cogentrex validates HTTP input, provider output, tool arguments, policy metadata, and persisted records
    at their boundaries.
  concept_ids:
  - typed-runtime
  related_ids: []
  learn_more:
  - docs/course/concepts/typed-runtime.md
  - backend/app/runtime/models.py
  media_refs: []
