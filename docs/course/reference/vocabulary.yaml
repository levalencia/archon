- id: bounded-delegation
  term: Bounded Delegation
  aliases:
  - agent delegation
  - child delegation
  category: mcp-delegation
  level: intermediate
  definition: Dispatching a constrained sub-task to a child agent with explicit budget, scope, and capability limits
    rather than giving unrestricted access.
  cogentrex: Cogentrex implements one evidence-only no-tools verifier child; no dynamic swarm, generic reflection,
    or multi-child orchestration exists.
  concept_ids:
  - bounded-delegation
  related_ids: []
  learn_more:
  - docs/course/concepts/bounded-delegation.md
  - docs/course/modules/11-bounded-delegation/README.md
  media_refs: []
  eval_concept_ids: []
- id: budget
  term: Budget
  aliases:
  - RuntimeBudget
  category: tools-policy-security
  level: beginner
  definition: A hard limit on iterations, tool calls, tokens, time, or output size. Budgets bound agent behavior
    to prevent unbounded resource consumption or runaway loops.
  cogentrex: RuntimeBudget in backend/app/runtime/engine.py configures max_iterations, max_tool_calls, max_tokens,
    and deadline. Constructed via create_chat_runtime in backend/app/runtime/factory.py.
  concept_ids:
  - react-loop
  - cost-usage-budgets
  related_ids: []
  learn_more:
  - docs/course/concepts/react.md
  - docs/course/reference/glossary.md
  media_refs: []
