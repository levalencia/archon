  evidence: []
  limitations: "Rule-based compliance checks plus admin-only guardrail red-team and bounded fuzz routes exist and are unit-tested, but compliance is not a mandatory chat boundary and the probes do not execute full agent trajectories. No mandatory compliance call in both chat paths, versioned policy approvals, full-trajectory attacks, regression gate, or compliance certification."

- id: agent-communication-security
  title: "Agent communication security"
  status: implemented
  module: docs/course/modules/11-bounded-delegation/README.md
  sources:
    - backend/app/delegation/envelope.py
    - backend/app/delegation/service.py
    - backend/app/services/grounded_rag.py
  tests:
    - backend/tests/security/test_delegation_envelope.py
    - backend/tests/unit/test_evidence_verifier.py
  evidence:
    - docs/IMPLEMENTATION-EVIDENCE.md
  limitations: "The active verifier requires a parent-issued HMAC envelope bound to actual bounded claim/evidence content, owner/project/run scope, budget, freshness, nonce, schema and key version, with durable replay receipts. This authenticates local in-process delegation metadata; it does not encrypt content or establish a remote multi-host PKI."

