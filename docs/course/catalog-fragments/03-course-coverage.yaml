    - backend/tests/security/test_sandbox_runner.py
    - backend/tests/unit/test_sandbox_wire.py
  evidence:
    - docs/IMPLEMENTATION-EVIDENCE.md
  limitations: "The verified local target uses a separate non-root, networkless, read-only runner container over a private Unix socket with resource bounds, child seccomp, peer-disconnect cancellation, unconditional process-group cleanup, and bounded encoded response frames. This is not VM-grade hostile multi-tenant certification, public deployment, or a production SLO."

