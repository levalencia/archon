- id: background-jobs-scheduling
  title: "Background jobs and scheduling"
  status: implemented
  module: docs/course/modules/10-resilience/README.md
  sources:
    - backend/app/services/task_queue.py
    - backend/app/workers/jobs.py
    - backend/app/routes/tasks.py
  tests:
    - backend/tests/integration/test_durable_jobs.py
    - frontend/src/lib/components/JobInspector.test.ts
  evidence:
    - docs/IMPLEMENTATION-EVIDENCE.md
  limitations: "Durable owner/project-scoped SQL jobs have atomic claims, monotonic lease fencing, heartbeat, retry/dead-letter, cancellation, restart persistence and UI. Execution is at-least-once, not exactly-once. In-process cancellation-resistant coroutines cannot be forcibly killed, so non-idempotent external-effect job kinds are prohibited; process isolation is deferred to S8.7."

- id: compliance-red-teaming
