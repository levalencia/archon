version: 2

roadmap:
  - id: foundations
    title: Foundations and bounded runtime
    question: What is an agent, and how does Archon keep execution bounded?
    outcome: Explain the trust boundary, typed contracts, state machine, and ReAct loop.
    module_ids: [00-agent-anatomy, 01-python-architecture, 02-typed-runtime, 03-react-loop]
  - id: governance
    title: Tools and governance
    question: How can a model request effects without receiving unchecked power?
    outcome: Trace a tool call through schema validation, policy, approval, isolation, and idempotency.
    module_ids: [04-tools-and-schemas, 05-policy-and-approvals]
  - id: knowledge
    title: Context, memory, and grounded knowledge
    question: What information enters a run, persists between runs, or supports an answer?
    outcome: Distinguish context, durable memory, retrieval, grounding, citations, and faithfulness.
    module_ids: [06-context-and-memory, 07-run-ledger, 08-rag-grounding]
  - id: evaluation
    title: Evaluation and resilience
    question: How does Archon measure quality and respond to failure?
    outcome: Explain recorded evaluation, drift, retries, breakers, fallbacks, rate limits, and jobs.
    module_ids: [09-evaluation-harness, 10-resilience]
  - id: coordination
    title: Delegation and governed integrations
    question: How does work cross agent and process boundaries safely?
    outcome: Explain bounded delegation, lineage, signed envelopes, governed stdio/Streamable HTTP MCP profiles, and scoped inventory.
    module_ids: [11-bounded-delegation, 12-governed-mcp]
  - id: product-operations
    title: Product surface and operations
    question: How does the user inspect Archon, and how is the local system operated?
    outcome: Demonstrate auth, SSE, observability, multimodal artifacts, Docker, migrations, backup, and readiness.
    module_ids: [13-auth-ui-observability, 14-local-operations, 15-capstone]

stories:
  - id: request-lifecycle
    title: A user sends a message
    description: Follow one authenticated request from the browser to a durable, inspectable result.
    steps:
      - title: Submit message
        from: Browser
        to: Gateway
        relationship: HTTP POST
        explanation: The Workbench submits the user message through the loopback gateway.
        concept_ids: [authentication, sse]
      - title: Establish ownership
        from: Gateway
        to: Authentication
        relationship: AUTHENTICATES WITH
        explanation: Security middleware and JWT validation establish the caller before protected work begins.
        concept_ids: [authentication, authorization-ownership]
      - title: Create bounded run
        from: Authentication
        to: Agent runtime
        relationship: AUTHORIZES
        explanation: The runtime creates typed state, budgets, stop conditions, and correlation context.
        concept_ids: [typed-runtime, runtime-state-machine, cost-usage-budgets]
      - title: Decide next action
        from: Agent runtime
        to: Model adapter
        relationship: CALLS
        explanation: The bounded ReAct loop asks the configured provider for a response or structured tool request.
        concept_ids: [react-loop, provider-adapters-capability-parity]
      - title: Govern any effect
        from: Model adapter
        to: Policy engine
        relationship: PROPOSES TOOL
        explanation: Tool arguments are validated and policy decides ALLOW, ASK, or DENY before execution.
        concept_ids: [tool-contracts, json-schema-subset, policy-engine]
      - title: Execute or pause
        from: Policy engine
        to: Tool execution
        relationship: GATES
        explanation: Approval-bound effects pause durably; allowed effects execute with isolation and idempotency controls.
        concept_ids: [durable-approvals, idempotency, execution-isolation-sandbox]
      - title: Persist evidence
        from: Tool execution
        to: Run Ledger
        relationship: RECORDS
        explanation: Events, outputs, effects, stop reasons, and lineage become durable evidence.
        concept_ids: [run-ledger, replay-fork-compare]
      - title: Stream result
        from: Run Ledger
        to: Workbench
        relationship: EMITS SSE
        explanation: Ordered runtime events and the final answer are exposed to the authenticated user for inspection.
        concept_ids: [sse, structured-logging, tracing-opentelemetry]

  - id: governed-tool
    title: A model requests a tool
    description: See how structured model intent becomes a policy-controlled side effect.
    steps:
      - title: Produce structured intent
        from: Model adapter
        to: Tool contract
        relationship: REQUESTS
        explanation: The provider emits a named tool request with typed arguments rather than executing code directly.
        concept_ids: [provider-adapters-capability-parity, tool-contracts]
      - title: Validate arguments
        from: Tool contract
        to: Schema validator
        relationship: VALIDATES
        explanation: Unsupported or malformed arguments fail before policy or execution.
        concept_ids: [json-schema-subset, structured-output-prompt-caching]
      - title: Classify effect
        from: Schema validator
        to: Policy engine
        relationship: EVALUATES
        explanation: Deterministic policy considers tool, arguments, ownership, and effect class.
        concept_ids: [policy-engine]
      - title: Bind approval
        from: Policy engine
        to: Approval repository
        relationship: ASK
        explanation: ASK creates a durable approval tied to the exact run, tool, arguments, and effect.
        concept_ids: [durable-approvals]
      - title: Prevent duplicate effects
        from: Approval repository
        to: Effect ledger
        relationship: AUTHORIZES ONCE
        explanation: Idempotency and durable effect state prevent accidental duplicate side effects.
        concept_ids: [idempotency, run-ledger]
      - title: Execute in boundary
        from: Effect ledger
        to: Sandbox or adapter
        relationship: EXECUTES
        explanation: The approved tool runs inside its declared isolation and permission boundary.
        concept_ids: [execution-isolation-sandbox, mcp]
      - title: Return observable result
        from: Sandbox or adapter
        to: Agent runtime
        relationship: RETURNS
        explanation: Structured success or error feedback re-enters the bounded runtime and is recorded.
        concept_ids: [react-loop, structured-logging]

  - id: memory-rag
    title: Archon answers with grounded knowledge
    description: Separate transient context, durable memory, retrieval, and answer verification.
    steps:
      - title: Build run context
        from: Conversation
        to: Context window
        relationship: SELECTS
        explanation: Approved immutable project-instruction snapshots and exact skill revisions join scoped messages and memory; hashes, order, and selection reasons enter provenance without raw bodies.
        concept_ids: [context-windows, conversation-lifecycle, skills-project-instructions]
      - title: Load durable memory
        from: Encrypted memory
        to: Context window
        relationship: READS SCOPED
        explanation: Owner and project boundaries restrict which persisted memories may influence the run.
        concept_ids: [encrypted-memory, pii-redaction-data-boundaries]
      - title: Prepare knowledge
        from: Documents
        to: Chunks
        relationship: SPLITS
        explanation: Ingested documents are normalized and divided into retrievable units with provenance.
        concept_ids: [chunking]
      - title: Locate candidates
        from: Chunks
        to: Retrieval
        relationship: SUPPLIES INPUT TO
        explanation: Embeddings and similarity ranking locate potentially relevant passages; similarity is not proof.
        concept_ids: [embeddings, retrieval]
      - title: Generate from evidence
        from: Retrieval
        to: RAG response
        relationship: GROUNDS
        explanation: The model receives selected evidence and instructions to keep claims conservative.
        concept_ids: [rag, groundedness]
      - title: Verify and cite
        from: RAG response
        to: Evaluation
        relationship: CHECKS
        explanation: Citation presence and faithfulness are evaluated separately from retrieval relevance.
        concept_ids: [citations, faithfulness, evaluation-harness]

  - id: observability
    title: A run becomes evidence
    description: Follow runtime events into logs, metrics, traces, evaluation, and the user interface.
    steps:
      - title: Emit typed events
        from: Agent runtime
        to: Runtime event stream
        relationship: EMITS
        explanation: State transitions produce structured events with run and correlation identifiers.
        concept_ids: [runtime-state-machine, sse]
      - title: Persist the timeline
        from: Runtime event stream
        to: Run Ledger
        relationship: APPENDS
        explanation: Durable ordered events support later inspection, replay, fork, and comparison.
        concept_ids: [run-ledger, replay-fork-compare]
      - title: Produce operational signals
        from: Runtime event stream
        to: Observability
        relationship: FAN OUT
        explanation: Logs, counters, latency metrics, and trace spans provide complementary views.
        concept_ids: [structured-logging, metrics, tracing-opentelemetry]
      - title: Evaluate recorded output
        from: Run Ledger
        to: Evaluation harness
        relationship: SCORES
        explanation: Recorded-run evaluators produce durable reports without pretending every metric is model judgment.
        concept_ids: [evaluation-harness, groundedness, faithfulness]
      - title: Detect change
        from: Evaluation harness
        to: Drift workflow
        relationship: COMPARES
        explanation: Candidate behavior is measured and any optimization remains bounded and approval-gated.
        concept_ids: [learning-optimization-drift]
      - title: Surface evidence
        from: Evidence stores
        to: Workbench
        relationship: RENDERS
        explanation: The UI shows timelines, summaries, evaluation reports, and explicit limitations.
        concept_ids: [multimodal-and-artifacts, authorization-ownership]

  - id: local-startup
    title: The local stack becomes ready
    description: Distinguish process liveness, dependency readiness, and actual application acceptance.
    steps:
      - title: Generate protected runtime context
        from: local-stack.sh
        to: Compose environment
        relationship: CREATES
        explanation: The wrapper creates protected infrastructure secrets and records exact runtime metadata.
        concept_ids: [docker-compose]
      - title: Start dependencies
        from: Compose
        to: PostgreSQL + Redis
        relationship: STARTS
        explanation: Durable stores must become healthy before the backend can claim readiness.
        concept_ids: [docker-compose, migrations]
      - title: Apply schema
        from: Backend entrypoint
        to: PostgreSQL
        relationship: MIGRATES
        explanation: Database migrations run before application traffic is accepted.
        concept_ids: [migrations]
      - title: Start application services
        from: Compose
        to: Backend + Frontend + Sandbox + OTEL
        relationship: STARTS
        explanation: Each service runs with its own health or containment contract.
        concept_ids: [execution-isolation-sandbox, tracing-opentelemetry]
      - title: Prove readiness
        from: Gateway
        to: Health endpoints
        relationship: CHECKS
        explanation: Health and readiness checks prove process and dependency state, not model intelligence.
        concept_ids: [liveness-readiness]
      - title: Run acceptance
        from: Smoke test
        to: User-facing API
        relationship: EXERCISES
        explanation: Auth, chat, persistence, metrics, migrations, and trace export are exercised through the retained stack.
        concept_ids: [ci, backup-restore, rto-rpo]

architecture:
  layers:
    - id: experience
      title: User experience
      description: Authenticated interfaces for conversations, inspection, learning, and evidence.
      components:
        - id: browser-workbench
          title: Browser and Workbench
          responsibility: Submit requests and inspect runs, approvals, artifacts, and evaluations.
          concept_ids: [sse, multimodal-and-artifacts]
        - id: visual-learning
          title: Visual Learning Studio
          responsibility: Teach stable roadmaps, flows, architecture, evidence, and media recipes.
          concept_ids: [skills-project-instructions]
    - id: access-control
      title: Access and control
      description: Establish identity, ownership, routing, and deterministic effect policy.
      components:
        - id: gateway
          title: Gateway
          responsibility: Provide the loopback entry point and route frontend/API traffic.
          concept_ids: [docker-compose]
        - id: auth
          title: Authentication and ownership
          responsibility: Bind every protected resource and request to an authenticated owner.
          concept_ids: [authentication, authorization-ownership]
        - id: policy
          title: Policy and approvals
          responsibility: Decide ALLOW, ASK, or DENY and preserve exact approval bindings.
          concept_ids: [policy-engine, durable-approvals]
    - id: runtime
      title: Agent runtime
      description: Execute bounded model/tool loops under typed state, budgets, and stop conditions.
      components:
        - id: context-runtime
          title: Context builder
          responsibility: Assemble approved instruction snapshots and exact selected skill revisions with scoped messages, memory, budgets, and metadata-only provenance.
          concept_ids: [context-windows, conversation-lifecycle, skills-project-instructions]
        - id: react-runtime
          title: Bounded ReAct engine
          responsibility: Coordinate provider calls, tool proposals, feedback, and stop reasons.
          concept_ids: [typed-runtime, runtime-state-machine, react-loop]
        - id: provider-layer
          title: Provider adapters
          responsibility: Normalize model capabilities without coupling the runtime to one vendor.
          concept_ids: [provider-adapters-capability-parity, structured-output-prompt-caching]
        - id: tool-layer
          title: Tool and MCP layer
          responsibility: Select schemas lazily, then validate, govern, isolate, and invoke native or deployment-profiled stdio/Streamable HTTP MCP tools.
          concept_ids: [tool-contracts, mcp, mcp-transports-inventory]
    - id: data-evidence
      title: Data and evidence
      description: Persist state, knowledge, effects, approvals, and inspectable run history.
      components:
        - id: relational-data
          title: PostgreSQL repositories
          responsibility: Persist users, conversations, approvals, runs, evaluations, and jobs.
          concept_ids: [run-ledger, durable-approvals, background-jobs-scheduling]
        - id: redis-data
          title: Redis runtime state
          responsibility: Support scoped cache, coordination, and rate-limiting contracts.
          concept_ids: [rate-limiting, encrypted-memory]
        - id: knowledge-data
          title: Documents and retrieval
          responsibility: Ingest, chunk, rank, ground, and cite source material.
          concept_ids: [chunking, embeddings, retrieval, rag, citations]
        - id: effect-data
          title: Effect and audit ledgers
          responsibility: Record idempotency, effects, lineage, exports, and disclosure decisions.
          concept_ids: [idempotency, export-share-redaction, parent-child-lineage]
    - id: reliability
      title: Reliability and observability
      description: Measure behavior, contain failure, and prove local readiness.
      components:
        - id: resilience
          title: Resilience controls
          responsibility: Apply retries, timeouts, breakers, fallbacks, rate limits, and durable jobs.
          concept_ids: [retries-timeouts-cancellation, circuit-breaker, fallback, rate-limiting]
        - id: observability
          title: Logs, metrics, and traces
          responsibility: Correlate operational signals without treating one signal as complete evidence.
          concept_ids: [structured-logging, metrics, tracing-opentelemetry]
        - id: evaluation
          title: Evaluation and drift
          responsibility: Score recorded runs and gate any proposed optimization.
          concept_ids: [evaluation-harness, learning-optimization-drift]
        - id: operations
          title: Local operations
          responsibility: Build, migrate, back up, restore, and prove liveness/readiness.
          concept_ids: [liveness-readiness, docker-compose, migrations, backup-restore, ci]
  relations:
    - {source: browser-workbench, target: gateway, type: CALLS, label: HTTP and SSE}
    - {source: gateway, target: auth, type: ROUTES, label: protected requests}
    - {source: auth, target: context-runtime, type: AUTHORIZES, label: owner-scoped request}
    - {source: context-runtime, target: react-runtime, type: BUILDS_CONTEXT_FOR, label: messages and provenance}
    - {source: react-runtime, target: provider-layer, type: CALLS, label: model request}
    - {source: provider-layer, target: policy, type: PROPOSES, label: structured tool request}
    - {source: policy, target: tool-layer, type: GATES, label: ALLOW ASK DENY}
    - {source: tool-layer, target: effect-data, type: PERSISTS_TO, label: effects and audit}
    - {source: react-runtime, target: relational-data, type: PERSISTS_TO, label: run timeline}
    - {source: context-runtime, target: knowledge-data, type: READS, label: grounded context}
    - {source: react-runtime, target: observability, type: EMITS, label: logs metrics traces}
    - {source: relational-data, target: evaluation, type: SUPPLIES_RUNS_TO, label: recorded runs}
    - {source: resilience, target: react-runtime, type: CONSTRAINS, label: retries budgets failures}
    - {source: operations, target: gateway, type: PROVES_READY, label: health and readiness}
